function hyWeek(n) {
  const c = HY[n]; const P = { sets: c.ps, reps: c.p }; const H = { sets: c.hs, reps: c.h };
  const deload = n % 4 === 3; const dl = { sets: deload ? 2 : 3, reps: String(Math.max(3, parseInt(c.p) - 2)) };
  const day = (name, d, exercises) => ({ name, day: d, dayNote: c.note, exercises });
  return {
    id: "hy" + n, label: `SEMANA ${n + 1}`,
    days: [
      day("TORSO · FUERZA", "Lunes", [
        { name: "Bench press", ...P },
        { name: "Bent-over barbell row", ...P },
        { name: "Standing barbell press", sets: deload ? 2 : 3, reps: "8" },
        { name: "Weighted pull-ups (or lat pulldown)", sets: deload ? 2 : 3, reps: "6-8" },
        { name: "Barbell curls", ...H },
        { name: "Skull crushers", ...H },

        { name: "Barbell squats", ...P },
        { name: "Deadlift", ...dl },
        { name: "Leg press", ...H },
        { name: "Lying leg curls", ...H },
        { name: "Standing calf raises", sets: c.hs + 1, reps: "10" },
        { name: "Leg raise on bars", sets: 3, reps: "12" },

        { name: "Lateral raises with dumbbells", sets: c.hs + 1, reps: "15" },
        { name: "Incline dumbbell curls", sets: c.hs, reps: "12" },
        { name: "Triceps pushdowns", sets: c.hs, reps: "12" },
      ]),

        { name: "Front squats", ...H },
        { name: "Romanian deadlift", sets: c.hs + 1, reps: c.h },
        { name: "Walking lunges with dumbbells", sets: c.hs, reps: "12" },

        { name: "Seated calf raises", sets: c.hs + 1, reps: "15" },

}

function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function read(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function loadPrograms() {
  const p = read("gym_programs_v5");
  const hy = () => [0, 1, 2, 3, 4, 5, 6, 7].map(hyWeek);
  if (p && p.fuerza && p.fullbody) return p.hipertrofia ? p : { ...p, hipertrofia: hy() };
  const old = read("gym_prog_v4");
  return { fuerza: Array.isArray(old) && old.length ? old : PROGRAM, fullbody: [0, 1, 2, 3].map(fbWeek), hipertrofia: hy() };
}
function loadVideos() {
  const v = read("gym_videos_v3");
  if (v) return v;
  const out = {}; const old = read("gym_videos_v2") || {};
  Object.entries(old).forEach(([k, u]) => { if (u) out[k] = [u]; });

}
function cleanName(n) { return (n || "").replace(/\(.*?\)/g, "").replace(/⚠️.*/, "").replace(/\s+/g, " ").trim().toLowerCase(); }
function ytSearch(n) { return "https://www.youtube.com/results?search_query=" + encodeURIComponent(cleanName(n) + " exercise proper form tutorial"); }
function ytId(url) { if (!url) return null; const m = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/); return m ? m[1] : null; }
// ── Vídeos propios guardados en el móvil (IndexedDB) ──
const IDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open("gym_media", 1);
      r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains("clips")) d.createObjectStore("clips", { keyPath: "id" }).createIndex("ex", "ex"); };
      r.onsuccess = () => { this.db = r.result; res(r.result); };
      r.onerror = () => rej(r.error);
    });
  },
  async run(mode, fn) {
    const d = await this.open();
    return new Promise((res, rej) => {
      const t = d.transaction("clips", mode); const req = fn(t.objectStore("clips"));
      t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  put(clip) { return this.run("readwrite", s => s.put(clip)); },
  del(id) { return this.run("readwrite", s => s.delete(id)); },
  byEx(ex) { return this.run("readonly", s => s.index("ex").getAll(ex)); },
  async counts() {
    const d = await this.open();
    return new Promise((res, rej) => {
      const out = {}; const t = d.transaction("clips"); const req = t.objectStore("clips").index("ex").openKeyCursor();
      req.onsuccess = () => { const c = req.result; if (c) { out[c.key] = (out[c.key] || 0) + 1; c.continue(); } };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error);
    });
  },
};
function fmtSize(b) { return b > 1e6 ? (b / 1e6).toFixed(0) + " MB" : Math.max(1, Math.round(b / 1e3)) + " KB"; }
function blankSets(n) { return Array.from({ length: n }, () => ({ kg: "", reps: "", done: false })); }
function fmtDate(t) { try { return new Date(t).toLocaleDateString("es-ES", { weekday: "short", day: "numeric", month: "short" }); } catch { return ""; } }

  function refreshCounts() { IDB.counts().then(setClipCounts).catch(() => {}); }
  useEffect(() => { refreshCounts(); try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {} }, []);
  function loadClips(name) {
    IDB.byEx(cleanName(name)).then(list => {
      setClips(prev => { prev.forEach(c => URL.revokeObjectURL(c.url)); return (list || []).sort((a, b) => a.created - b.created).map(c => ({ ...c, url: URL.createObjectURL(c.blob) })); });
    }).catch(() => setClips([]));
  }
  useEffect(() => { if (videoModal) loadClips(videoModal.name); else setClips(prev => { prev.forEach(c => URL.revokeObjectURL(c.url)); return []; }); }, [videoModal]);
  async function uploadClips(e) {
    const files = Array.from(e.target.files || []); e.target.value = "";

    const big = files.find(f => f.size > 300e6);
    if (big && !confirm("Este vídeo pesa " + fmtSize(big.size) + ". Ocupará mucho espacio en el móvil. ¿Guardarlo igualmente?")) return;
    setSaving(true);
    const ex = cleanName(videoModal.name); let ok = 0;
    for (const f of files) {
      const clip = { id: Date.now() + "_" + Math.random().toString(36).slice(2), ex, name: f.name, type: f.type, size: f.size, created: Date.now(), blob: f };
      try { await IDB.put(clip); ok++; }
      catch { try { await IDB.put({ ...clip, blob: new Blob([await f.arrayBuffer()], { type: f.type }) }); ok++; } catch {} }
    }
    setSaving(false); loadClips(videoModal.name); refreshCounts();
    showToast(ok ? "🎬 Vídeo guardado" : "No se pudo guardar el vídeo (¿falta espacio?)");
  }
  async function deleteClip(id) {

    try { await IDB.del(id); } catch {}
    loadClips(videoModal.name); refreshCounts();
  }

  useEffect(() => { save("gymlog_v3", db); }, [db]);
  useEffect(() => { save("gym_programs_v5", programs); }, [programs]);
  useEffect(() => { save("gym_videos_v3", videos); }, [videos]);

  async function pasteVideo() { try { const t = await navigator.clipboard.readText(); if (t) setVideoInput(t.trim()); } catch { showToast("Mantén pulsado el campo y elige Pegar"); } }

  }

  const attended = !!session.attended;
  const completedSets = dayData?.exercises.reduce((a, _, ei) => a + getSets(ei).filter(s => s.done).length, 0) || 0;
  const totalSets = dayData?.exercises.reduce((a, _, ei) => a + getSets(ei).length, 0) || 0;
  const progress = totalSets ? Math.round(completedSets / totalSets * 100) : 0;

                <div style={{ marginTop: 14, height: 8, background: LINE, borderRadius: 4 }}>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 20 }}>
              {[["Total entrenos", log.length, TXT], ...Object.entries(META).map(([id, m]) => [m.icon + " " + m.short, log.filter(l => l.pid === id).length, m.color])].map(([l, v, col]) => (
                <div key={l} style={{ background: CARD, borderRadius: 14, padding: "14px 8px", border: `1.5px solid ${LINE}`, textAlign: "center" }}>
                  <div style={{ fontSize: 30, fontWeight: 800, color: col }}>{v}</div>
                  <div style={{ fontSize: 13, color: SUB, fontWeight: 600, marginTop: 2 }}>{l}</div>
                </div>
              ))}
            </div>
            {log.length === 0 ? (
              <div style={{ textAlign: "center", color: SUB, marginTop: 50, fontSize: 17, lineHeight: 1.5 }}>Aún no hay entrenos registrados.<br />Pulsa "Marcar hecho" al terminar.</div>
            ) : log.map(({ key, pid, weekLabel, dayName, note, at }) => (
              <div key={key} style={{ marginBottom: 10, background: CARD, borderRadius: 14, padding: "14px", border: `1.5px solid ${LINE}`, borderLeft: `5px solid ${META[pid].color}` }}>
                <div style={{ display: "flex", justifyContent: "space-between", gap: 8 }}>
                  <span style={{ fontSize: 17, fontWeight: 800 }}>{dayName}</span>
                  {at > 0 && <span style={{ fontSize: 14, color: SUB, fontWeight: 600 }}>{fmtDate(at)}</span>}
                </div>
                <div style={{ fontSize: 14, color: META[pid].color, fontWeight: 700, marginTop: 4 }}>{META[pid].long} · {weekLabel}</div>
                {note && <div style={{ fontSize: 15, color: SUB, marginTop: 8, fontStyle: "italic" }}>"{note}"</div>}
              </div>
            ))}
          </div>
        )}
      </div>

      {/* PANEL DE VÍDEOS */}
      {videoModal && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.45)", zIndex: 200, display: "flex", alignItems: "flex-end", justifyContent: "center" }}
          onClick={e => { if (e.target === e.currentTarget) setVideoModal(null); }}>
          <div style={{ width: "100%", maxWidth: 560, maxHeight: "88vh", overflowY: "auto", background: CARD, borderRadius: "20px 20px 0 0", padding: "20px 18px", paddingBottom: "max(env(safe-area-inset-bottom), 24px)" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
              <div>
                <div style={{ fontSize: 13, color: SUB, fontWeight: 700 }}>VÍDEOS DEL EJERCICIO</div>
                <div style={{ fontSize: 20, fontWeight: 800, marginTop: 2 }}>{videoModal.name}</div>
              </div>
              <button onClick={() => setVideoModal(null)} style={{ ...smallBtn, fontSize: 18, padding: "6px 12px" }}>✕</button>
            </div>

            <label style={{ display: "block", marginTop: 16, padding: "16px", background: saving ? LINE : C, borderRadius: 12, color: "#fff", fontSize: 17, fontWeight: 800, textAlign: "center", cursor: "pointer" }}>
              {saving ? "⏳ Guardando vídeo..." : "📱 Subir vídeo de mi galería"}
              <input type="file" accept="video/*" multiple disabled={saving} onChange={uploadClips} style={{ display: "none" }} />
            </label>
            <div style={{ marginTop: 6, fontSize: 13, color: SUB, lineHeight: 1.4 }}>Se guarda dentro de la app, en este móvil. Aparecerá en este ejercicio en todas las semanas y programas.</div>

            <div style={{ marginTop: 20, fontSize: 13, color: SUB, fontWeight: 700 }}>MIS VÍDEOS ({clips.length})</div>
            {clips.length === 0 && <div style={{ marginTop: 8, fontSize: 15, color: SUB }}>Aún no has subido ninguno.</div>}
            {clips.map((c, i) => (
              <div key={c.id} style={{ marginTop: 10, border: `1.5px solid ${LINE}`, borderRadius: 12, overflow: "hidden" }}>
                <video src={c.url + "#t=0.1"} controls playsInline preload="metadata" style={{ width: "100%", maxHeight: 420, display: "block", background: "#000" }} />
                <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 12px" }}>
                  <span style={{ flex: 1, fontSize: 15, fontWeight: 700 }}>Vídeo {i + 1} <span style={{ color: SUB, fontWeight: 500, fontSize: 13 }}>· {fmtDate(c.created)} · {fmtSize(c.size || 0)}</span></span>
                  <button onClick={() => deleteClip(c.id)} style={{ ...smallBtn, color: "#c62828", padding: "6px 10px" }}>🗑</button>
                </div>
              </div>
            ))}

            <a href={ytSearch(videoModal.name)} target="_blank" rel="noreferrer" style={{ display: "block", marginTop: 22, padding: "13px", background: SOFT, border: `2px solid ${C}`, borderRadius: 12, color: C, fontSize: 15, fontWeight: 800, textDecoration: "none", textAlign: "center" }}>🔎 Buscar tutoriales en YouTube</a>

            <button onClick={() => setShowLinks(!showLinks)} style={{ ...smallBtn, width: "100%", marginTop: 10, padding: 12 }}>{showLinks ? "▲" : "▼"} Enlaces de internet guardados ({modalVideos.length})</button>
            {showLinks && (
              <>
                {modalVideos.map((url, i) => {
                  const id = ytId(url);
                  return (
                    <div key={i} style={{ marginTop: 10, border: `1.5px solid ${LINE}`, borderRadius: 12, overflow: "hidden" }}>
                      {id && <iframe src={`https://www.youtube.com/embed/${id}`} style={{ width: "100%", aspectRatio: "16 / 9", border: "none", display: "block" }} allowFullScreen title={"video" + i} />}
                      <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 12px" }}>
                        <a href={url} target="_blank" rel="noreferrer" style={{ flex: 1, color: C, fontSize: 15, fontWeight: 700, textDecoration: "none", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{id ? "▶ Enlace " + (i + 1) + " · abrir en YouTube" : "🔗 " + url}</a>
                        <button onClick={() => { if (confirm("¿Borrar este enlace?")) removeVideo(i); }} style={{ ...smallBtn, color: "#c62828", padding: "6px 10px" }}>🗑</button>
                      </div>
                    </div>
                  );
                })}
                <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                  <input value={videoInput} onChange={e => setVideoInput(e.target.value)} placeholder="Pega un enlace https://..." style={{ flex: 1, minWidth: 0, background: "#fbfaf7", border: `1.5px solid ${LINE}`, borderRadius: 10, color: TXT, fontSize: 16, padding: "12px" }} />
                  <button onClick={pasteVideo} style={{ ...smallBtn, padding: "8px 12px" }}>📋</button>
                  <button onClick={addVideo} style={{ ...smallBtn, padding: "8px 12px", color: C, borderColor: C }}>Añadir</button>
                </div>
              </>
            )}
          </div>
        </div>
      )}

      {toast && <div style={{ position: "fixed", bottom: "max(env(safe-area-inset-bottom), 24px)", left: "50%", transform: "translateX(-50%)", background: TXT, color: "#fff", borderRadius: 100, padding: "12px 22px", fontSize: 15, fontWeight: 700, whiteSpace: "nowrap", zIndex: 300 }}>{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<GymPlanner />);
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
    }
  </script>
</body>
</html>
